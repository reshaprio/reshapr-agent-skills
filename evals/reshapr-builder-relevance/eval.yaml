      Keep the rationale under 220 characters.

      Request:
      Reproduce this locally validated reShapr MCP server on an existing control plane and verify tools/list plus one tools/call.
    graders:
      - type: file-exists
        config:
          path: assessment.json
      - type: run-command
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('assessment.json', 'utf8'));
              if (data.skill !== 'reshapr-builder') throw new Error('wrong skill');
              if (data.useSkill !== true) throw new Error('expected useSkill=true');
              if (!Array.isArray(data.evidence) || data.evidence.length < 2) throw new Error('insufficient evidence');
              const joined = data.evidence.join(' ').toLowerCase();
              if (!joined.includes('control plane')) throw new Error('missing control plane evidence');
              if (!joined.includes('mcp')) throw new Error('missing mcp evidence');

