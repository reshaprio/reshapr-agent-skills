              if (!Array.isArray(data.evidence) || data.evidence.length < 2) throw new Error('insufficient evidence');
              const joined = data.evidence.join(' ').toLowerCase();
              if (!joined.includes('documentation') && !joined.includes('docusaurus')) throw new Error('missing docs evidence');

